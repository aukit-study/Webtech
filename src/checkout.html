<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Furnish</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3 navbar-custom">
      <div class="container-fluid px-0">
        <a class="navbar-brand" href="index.html">
          <span class="d-flex flex-column text-uppercase text-xs fw-bold lh-sm">
            <span class="" style="letter-spacing: .12rem;">Furnish</span>
            <span>Template</span>
          </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="checkout.html">Checkout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="login-page bg-light">
      <section class="login-section py-8">
        <div class="container">
          <div class="row justify-content-center align-items-center">
            <div class="col-lg-6 col-md-8">
              <div class="card login-card shadow-lg rounded-4 border-0">
                <div class="card-body p-5">
                  <div class="text-center mb-4">
                    <h1 class="h3 mb-2">Checkout</h1>
                    <p class="text-muted mb-0">Complete your purchase</p>
                  </div>

                  <!-- Cart Summary -->
                  <div class="mb-4 p-3 bg-light border rounded">
                    <h5 class="mb-3">Order Summary</h5>
                    <div id="cart-summary">
                      <p class="text-muted">Loading cart...</p>
                    </div>
                    <div class="border-top mt-3 pt-3">
                      <div class="d-flex justify-content-between fw-bold">
                        <span>Total:</span>
                        <span id="order-total">$0.00</span>
                      </div>
                    </div>
                  </div>

                  <!-- Checkout Form -->
                  <form id="checkout-form">
                    <div class="mb-3">
                      <label for="email" class="form-label">Email</label>
                      <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
                      <small id="email-error" class="text-danger d-none"></small>
                    </div>

                    <div class="mb-3">
                      <label for="creditCard" class="form-label">Credit Card (16 digits)</label>
                      <input type="text" class="form-control" id="creditCard" placeholder="1234 5678 9012 3456" maxlength="19" required>
                      <small id="creditCard-error" class="text-danger d-none"></small>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">Place Order</button>
                  </form>

                  <div id="success-message" class="alert alert-success mt-3 d-none" role="alert">
                    Order placed successfully! Redirecting...
                  </div>

                  <div id="error-message" class="alert alert-danger mt-3 d-none" role="alert"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-dark text-white py-5">
      <div class="container text-center">
        <p class="mb-1">Furnish Template</p>
        <small class="text-muted">Secure checkout</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/checkout.js"></script>
  </body>
</html>
