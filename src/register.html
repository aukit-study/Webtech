<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Furnish</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3 navbar-custom">
      <div class="container-fluid px-0">
        <a class="navbar-brand" href="index.html">
          <span class="d-flex flex-column text-uppercase text-xs fw-bold lh-sm">
            <span class="" style="letter-spacing: .12rem;">Furnish</span>
            <span>Template</span>
          </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="register.html">Register</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="login-page bg-light">
      <section class="login-section py-8">
        <div class="container">
          <div class="row justify-content-center align-items-center">
            <div class="col-lg-5 col-md-7">
              <div class="card login-card shadow-lg rounded-4 border-0">
                <div class="card-body p-5">
                  <div class="text-center mb-4">
                    <h1 class="h3 mb-2">Create Account</h1>
                    <p class="text-muted mb-0">Join us to start shopping.</p>
                  </div>
                  <form>
                    <div class="mb-3">
                      <label for="firstName" class="form-label">First Name</label>
                      <input type="text" class="form-control" id="firstName" placeholder="Enter your first name" required>
                    </div>
                    <div class="mb-3">
                      <label for="email" class="form-label">Email address</label>
                      <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                      <label for="password" class="form-label">Password</label>
                      <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                    </div>
                    <div class="mb-3">
                      <label for="confirmPassword" class="form-label">Confirm Password</label>
                      <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
                  </form>
                  <div class="text-center mt-4">
                    <p class="mb-0">Already have an account? <a href="login.html" class="text-decoration-none">Sign in</a></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-dark text-white py-5">
      <div class="container text-center">
        <p class="mb-1">Furnish Template</p>
        <small class="text-muted">Static HTML/CSS register page only.</small>
      </div>
    </footer>
    <script src="./assets/js/register.js"></script>
  </body>
</html>
